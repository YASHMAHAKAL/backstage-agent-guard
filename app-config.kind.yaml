# Optional read-only Kind view. Credentials stay in the process environment.
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: agent-guard-kind
          title: Agent Guard Kind (staging)
          url: ${AGENT_GUARD_K8S_URL}
          authProvider: serviceAccount
          serviceAccountToken: ${AGENT_GUARD_K8S_TOKEN}
          caData: ${AGENT_GUARD_K8S_CA_DATA}
          skipTLSVerify: false
          skipMetricsLookup: true
  objectTypes:
    - pods
    - services
    - configmaps
    - deployments
    - replicasets
    - jobs
    - cronjobs
