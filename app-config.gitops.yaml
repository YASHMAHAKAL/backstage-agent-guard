# Opt-in GitOps PR publishing. Load after app-config.yaml only when
# AGENT_GUARD_GITOPS_REPO_URL and GITHUB_TOKEN are configured.
integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

# Config arrays replace earlier arrays when overlays are merged, so retain the
# base locations. The Agent Guard Catalog provider discovers merged descriptors
# from this one private GitOps repository; no per-service URL is configured.
catalog:
  locations:
    - type: file
      target: ../../catalog-info.yaml
    - type: file
      target: ../../examples/entities.yaml
    - type: file
      target: ../../catalog/templates/nodejs-api/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../catalog/templates/fastapi-api/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../catalog/templates/scheduled-worker/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]
    - type: file
      target: ../../examples/github-users.yaml
      rules:
        - allow: [User]
