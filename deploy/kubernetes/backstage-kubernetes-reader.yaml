# Read-only, namespace-scoped credentials for Backstage's Kubernetes view.
# This cannot create, update, delete, exec into, or read Secret resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-kubernetes-reader
  namespace: staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-kubernetes-reader
  namespace: staging
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-kubernetes-reader
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: backstage-kubernetes-reader
    namespace: staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-kubernetes-reader
