# Opt-in real-user mode. Start with AGENT_GUARD_AUTH_MODE=github and load this
# config after app-config.yaml. A mode/config mismatch must not enable guest.
auth:
  environment: github
  providers:
    guest: null
    github:
      github:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: userIdMatchingUserEntityAnnotation
