name: Terraform checks (no AWS authority)

on:
  # Run on every PR so the checks can safely be required on main. A path
  # filter would leave unrelated PRs waiting forever for a skipped check.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/aws/bootstrap
          - infra/aws/registry
          - infra/aws/environments/staging
          - infra/aws/argocd
          - infra/aws/argo-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/aws
      - name: Fetch checksum-verified Argo chart for mocked tests
        if: matrix.root == 'infra/aws/argocd'
        run: node infra/cloud-platform/fetch-argocd-chart.mjs
      - name: Initialize without remote state
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        working-directory: ${{ matrix.root }}
        run: terraform validate -no-color
      - name: Run mocked provider tests
        working-directory: ${{ matrix.root }}
        run: terraform test -no-color

  cloud-chart-tests:
    name: Test cloud chart inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node .yarn/releases/yarn-4.13.0.cjs install --immutable
      - run: node --test infra/cloud-platform/charts.test.mjs

  runner-contract-tests:
    name: Test Terraform runner contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node .yarn/releases/yarn-4.13.0.cjs install --immutable
      - run: node .yarn/releases/yarn-4.13.0.cjs tsc:full
      - run: node .yarn/releases/yarn-4.13.0.cjs workspace @internal/backstage-plugin-agent-guard-backend build
      - run: node --test scripts/terraform-ci-inputs.test.cjs scripts/terraform-runner.test.cjs
      - run: >-
          node .yarn/releases/yarn-4.13.0.cjs workspace
          @internal/backstage-plugin-agent-guard-backend test --watch=false --runInBand
          terraformControl.test.ts terraformPlan.test.ts
          terraformPlanPreparation.test.ts terraformRemoteState.test.ts
          terraformConfigurationReader.test.ts terraformCapacityPublisher.test.ts
          terraformObservation.test.ts
