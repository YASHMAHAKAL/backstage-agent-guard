apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.serviceName }}
  namespace: staging
  labels:
    app.kubernetes.io/name: ${{ values.serviceName }}
    backstage.io/kubernetes-id: ${{ values.serviceName }}
spec:
  replicas: ${{ values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.serviceName }}
      backstage.io/kubernetes-id: ${{ values.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.serviceName }}
        backstage.io/kubernetes-id: ${{ values.serviceName }}
    spec:
      containers:
        - name: api
          image: docker.io/tiangolo/uvicorn-gunicorn-fastapi@sha256:02ee7db41f9ae909476117de6d68cd51a8027decf6d49870f18ebcfedb23db3f
          imagePullPolicy: IfNotPresent
          command: [uvicorn, 'main:app', --host, '0.0.0.0', --port, '8000']
          workingDir: /app
          env:
            - name: SERVICE_NAME
              value: ${{ values.serviceName }}
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: app-code
              mountPath: /app/main.py
              subPath: main.py
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: app-code
          configMap:
            name: ${{ values.serviceName }}-app
