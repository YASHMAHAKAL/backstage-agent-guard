# Reviewed operator bootstrap artifact, not part of the app release recipe.
# An explicit EKS access entry must separately map the actual reader IAM
# principal to rizz-cloud-observers. This file creates no AWS identities/access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rizz-cloud-observer
  namespace: rizz-staging
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [rizz-frontend, rizz-backend]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: ['']
    resources: [services]
    resourceNames: [rizz-frontend-service, rizz-backend-service]
    verbs: [get]
  - apiGroups: ['']
    resources: [services, configmaps]
    verbs: [list]
  # The backend reads bounded process-local Prometheus text through this
  # Service's API-server proxy. RBAC cannot restrict the proxy URL path.
  - apiGroups: ['']
    resources: [services/proxy]
    resourceNames: [rizz-backend-service]
    verbs: [get]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [rizz-runtime]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    resourceNames: [rizz-frontend]
    verbs: [get]
  # Retirement checks the complete dedicated namespace, including unlabelled
  # ingresses, before it will propose deleting the remaining app resources.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list]
  - apiGroups: [external-secrets.io]
    resources: [secretstores, externalsecrets]
    resourceNames: [rizz-runtime]
    verbs: [get]
  - apiGroups: [external-secrets.io]
    resources: [secretstores, externalsecrets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rizz-cloud-observer
  namespace: rizz-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rizz-cloud-observer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rizz-cloud-observers
