# Recipe fragment for clusters/eks-staging/apps/rizz-ai, not a live Secret.
# Controller credentials come from its own Pod Identity. Do not add role/jwt/
# static auth references: Pod Identity cannot authenticate via SA impersonation.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rizz-runtime
  namespace: rizz-staging
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rizz-runtime
  namespace: rizz-staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: rizz-runtime
    kind: SecretStore
  target:
    name: rizz-runtime-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: gen-ai-key
      remoteRef: { key: rizz/staging/runtime, property: gen-ai-key }
    - secretKey: demo-username
      remoteRef: { key: rizz/staging/runtime, property: demo-username }
    - secretKey: demo-password
      remoteRef: { key: rizz/staging/runtime, property: demo-password }
