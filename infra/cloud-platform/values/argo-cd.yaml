# Private, non-HA operator bootstrap. No application/repository credentials.
global:
  image:
    tag: v3.5.3
configs:
  cm:
    admin.enabled: true
    users.anonymous.enabled: false
    # Dedicated portal observer; token generation is a later operator step.
    accounts.rizz-observer: apiKey
  rbac:
    policy.default: ''
    policy.csv: |
      p, role:rizz-observer, applications, get, rizz-app/rizz-ai-staging, allow
      g, rizz-observer, role:rizz-observer
controller:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 768Mi }
repoServer:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
server:
  replicas: 1
  service: { type: ClusterIP }
  ingress: { enabled: false }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
redis:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
redisSecretInit:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
dex: { enabled: false }
# This pinned chart always renders the ApplicationSet Deployment; keep it idle.
applicationSet:
  replicas: 0
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
notifications: { enabled: false }
